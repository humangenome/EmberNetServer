name: Feature request
description: Suggest a new capability or behaviour for EmberNetServer
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests for the **EmberNet app** (the server list, connecting, characters, updates) belong on the [EmberNet hub](https://github.com/HumanGenome/EmberNet/issues).

  - type: textarea
    id: usecase
    attributes:
      label: What are you trying to run?
      description: Describe the situation, not the solution. What does EmberNetServer not let you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: What workaround exists, and why is it not good enough?

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I've searched existing issues and discussions for the same idea
          required: true
